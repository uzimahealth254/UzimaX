services:
  - type: web
    name: uzima-api
    runtime: node
    plan: starter
    buildCommand: npm install && npx drizzle-kit push && npm run db:rls
    startCommand: npm run start:api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: PORT
        value: 8787
      - key: NODE_ENV
        value: production
      # Paste Supabase pooler URL (session :5432 for migrations; transaction :6543 for app)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ALLOW_DEMO_OTP
        value: "false"
      - key: ENABLE_SIMULATED_WALLET
        value: "false"
      - key: VITE_ENABLE_WALLET
        value: "false"
      - key: VITE_ENABLE_ENGINE
        value: "false"
      - key: ALLOW_BODY_REFRESH
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      # Email (Resend): set EMAIL_PROVIDER=resend + RESEND_API_KEY in Render dashboard
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        value: IOU Exchange <no-reply@ioux.africa>
      - key: SUPPORT_EMAIL
        value: hello@ioux.africa
      - key: PORTAL_URL
        value: https://app.ioux.africa
      - key: SITE_URL
        value: https://www.ioux.africa
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMS_PROVIDER
        value: stub
      - key: AT_API_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_SENDER_ID
        value: IOUX
      - key: AFYAX_WEBHOOK_SECRET
        generateValue: true
      - key: AFYAX_SANDBOX_BASE_URL
        value: https://manager.smplystore.com
      - key: AFYAX_PRODUCTION_BASE_URL
        value: https://vendor.afyax.health
      - key: AFYAX_DEFAULT_PAYMENT_METHOD
        value: bank
      - key: IOUX_WEBHOOK_SECRET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: STORAGE_LOCAL_PATH
        value: ./storage
      - key: CORS_ORIGINS
        value: https://www.ioux.africa,https://ioux.africa,https://app.ioux.africa
      - key: REDIS_URL
        fromService:
          type: redis
          name: uzima-redis
          property: connectionString

  - type: web
    name: uzima-portal
    runtime: node
    plan: starter
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        value: https://uzimax.onrender.com
      - key: VITE_SHOW_DEMO
        value: "false"
      - key: VITE_ENABLE_WALLET
        value: "false"
      - key: VITE_ENABLE_ENGINE
        value: "false"

  - type: redis
    name: uzima-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
