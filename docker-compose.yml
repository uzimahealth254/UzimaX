services:
  postgres:
    image: postgres:15-alpine
    container_name: uzima-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: uzima
      POSTGRES_PASSWORD: uzima
      POSTGRES_DB: uzima
    volumes:
      - uzima_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uzima -d uzima"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: uzima-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - uzima_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  uzima_pg_data:
  uzima_redis_data:
