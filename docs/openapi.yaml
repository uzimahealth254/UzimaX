openapi: 3.0.3
info:
  title: Uzima Platform API
  description: |
    Unified JWT + API-key backend for Uzima trade receivables (UZIMA-ARCH-001).
    Dual origination, AfyaX parties/webhooks, wallets, fees, documents, packages, programmes.
  version: 2.0.0
servers:
  - url: http://localhost:8787
    description: Local development
security:
  - bearerAuth: []
  - apiKeyAuth: []
tags:
  - name: System
  - name: Auth
  - name: Parties
  - name: Invoices
  - name: OptIns
  - name: Verifications
  - name: Offers
  - name: Consents
  - name: Assignments
  - name: Escrow
  - name: Wallets
  - name: Packages
  - name: Programmes
  - name: Fees
  - name: Documents
  - name: Admin
  - name: Webhooks
paths:
  /api/v1/health:
    get:
      summary: Health check
      security: []
      tags: [System]
      responses:
        "200":
          description: Service is up
  /api/v1/auth/login:
    post:
      summary: Portal login (JWT + httpOnly refresh cookie)
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: accessToken + user (refreshToken in cookie; body only if ALLOW_BODY_REFRESH)
        "401":
          description: Invalid credentials
        "429":
          description: Rate limited / locked out
  /api/v1/auth/refresh:
    post:
      summary: Rotate refresh token and issue new access token
      security: []
      tags: [Auth]
      responses:
        "200":
          description: New accessToken
  /api/v1/auth/logout:
    post:
      summary: Revoke refresh tokens
      tags: [Auth]
      responses:
        "200":
          description: Logged out
  /api/v1/auth/me:
    get:
      summary: Current user
      tags: [Auth]
      responses:
        "200":
          description: User profile
    patch:
      summary: Update name/email
      tags: [Auth]
      responses:
        "200":
          description: Updated profile
  /api/v1/auth/forgot-password:
    post:
      summary: Request password-reset OTP
      security: []
      tags: [Auth]
      responses:
        "200":
          description: Always ok (no enumeration)
  /api/v1/auth/reset-password:
    post:
      summary: Reset password with OTP (strong password required)
      security: []
      tags: [Auth]
      responses:
        "200":
          description: Password updated
  /api/v1/parties:
    post:
      summary: Upsert AfyaX party (issues uzimaPartyId)
      tags: [Parties]
      security: [apiKeyAuth: []]
      responses:
        "201":
          description: Party created or existing
  /api/v1/parties/{uzimaPartyId}:
    get:
      summary: Get party by Uzima ID
      tags: [Parties]
      security: [apiKeyAuth: []]
      parameters:
        - name: uzimaPartyId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Organisation
  /api/v1/invoices:
    post:
      summary: Create invoice (portal JWT dual-origination OR AfyaX API key)
      tags: [Invoices]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [faceValue, issueDate, dueDate]
              properties:
                buyerOrgId: { type: string, format: uuid }
                supplierOrgId: { type: string, format: uuid }
                buyerPartyId: { type: string }
                supplierPartyId: { type: string }
                faceValue: { type: number }
                currency: { type: string }
                issueDate: { type: string, format: date }
                dueDate: { type: string, format: date }
                installmentSchedule:
                  type: array
                  items:
                    type: object
      responses:
        "201":
          description: Invoice created (returns invoiceId + iouRegistryId for API key)
    get:
      summary: List invoices for caller org/role
      tags: [Invoices]
      responses:
        "200":
          description: Invoice list
  /api/v1/invoices/{id}/status:
    get:
      summary: Invoice status (JWT or AfyaX API key with invoices:read)
      tags: [Invoices]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Status payload
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  iouRegistryId: { type: string }
                  status: { type: string }
                  listingStatus: { type: string }
  /api/v1/external/invoices:
    post:
      summary: AfyaX alias for POST /invoices (API key invoices:write)
      description: >
        When the API key belongs to a platform org, the created invoice is stamped with
        source_platform_org_id (IOUX source-of-truth; platform ID identifies origin).
      tags: [Invoices]
      security: [apiKeyAuth: []]
      responses:
        "201":
          description: Created with invoiceId + iouRegistryId (+ sourcePlatformOrgId when platform)
  /api/v1/invoices/{id}:
    get:
      summary: Invoice detail + status history (IDOR protected)
      tags: [Invoices]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Invoice
        "404":
          description: Not found / cross-tenant
  /api/v1/ious/{iouRegistryId}:
    get:
      summary: Lookup by IOU registry ID
      tags: [Invoices]
      parameters:
        - name: iouRegistryId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Invoice
  /api/v1/opt-ins:
    get:
      summary: List opt-ins
      tags: [OptIns]
      responses:
        "200":
          description: Opt-in rows
  /api/v1/opt-ins/{id}/respond:
    post:
      summary: Supplier accept/decline opt-in
      tags: [OptIns]
      responses:
        "200":
          description: Updated + optional assignment
  /api/v1/buyer-verifications:
    get:
      summary: List buyer verifications
      tags: [Verifications]
      responses:
        "200":
          description: Verification rows
  /api/v1/buyer-verifications/{id}/respond:
    post:
      summary: Buyer verify/reject supplier-listed invoice
      tags: [Verifications]
      responses:
        "200":
          description: Updated + optional assignment
  /api/v1/offers:
    get:
      summary: List purchase offers (role-scoped)
      tags: [Offers]
      responses:
        "200":
          description: Offers
    post:
      summary: SPV create offer (programme bands enforced)
      tags: [Offers]
      responses:
        "201":
          description: Offer created
  /api/v1/offers/{id}/respond:
    post:
      summary: Supplier accept/decline offer
      tags: [Offers]
      responses:
        "200":
          description: Offer + optional consent
  /api/v1/consents:
    get:
      summary: List assignment consents
      tags: [Consents]
      responses:
        "200":
          description: Consents
  /api/v1/consents/{id}/request-otp:
    post:
      summary: Send OTP for consent signing
      tags: [Consents]
      responses:
        "200":
          description: OTP sent
  /api/v1/consents/{id}/confirm-sign:
    post:
      summary: Confirm consent with OTP
      tags: [Consents]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [otp]
              properties:
                otp: { type: string }
      responses:
        "200":
          description: Signed + assignment
  /api/v1/assignments:
    get:
      summary: List assignments
      tags: [Assignments]
      responses:
        "200":
          description: Assignments
  /api/v1/escrow:
    get:
      summary: List escrow legs (SPV/admin)
      tags: [Escrow]
      responses:
        "200":
          description: Escrow legs
  /api/v1/escrow/{id}/release:
    post:
      summary: Release escrow leg
      tags: [Escrow]
      responses:
        "200":
          description: Updated leg
  /api/v1/wallets/me:
    get:
      summary: Own org wallet + transactions
      tags: [Wallets]
      responses:
        "200":
          description: Wallet
  /api/v1/wallets/me/deposit:
    post:
      summary: Simulated deposit (disabled in production)
      tags: [Wallets]
      responses:
        "200":
          description: Updated wallet
        "403":
          description: Simulation disabled
  /api/v1/wallets/me/withdraw:
    post:
      summary: Simulated withdraw (disabled in production)
      tags: [Wallets]
      responses:
        "200":
          description: Updated wallet
  /api/v1/packages:
    get:
      summary: List packages (SPV/admin)
      tags: [Packages]
      responses:
        "200":
          description: Packages
    post:
      summary: Create securitisation package
      tags: [Packages]
      responses:
        "201":
          description: Package created
  /api/v1/packages/{id}/status:
    patch:
      summary: Advance package status (NSE ref on listed)
      tags: [Packages]
      responses:
        "200":
          description: Updated package
  /api/v1/programmes:
    get:
      summary: Programme utilisation
      tags: [Programmes]
      responses:
        "200":
          description: Programmes
    post:
      summary: Create programme (admin)
      tags: [Programmes]
      responses:
        "201":
          description: Created
  /api/v1/programmes/{id}:
    patch:
      summary: Update programme
      tags: [Programmes]
      responses:
        "200":
          description: Updated
  /api/v1/fees:
    get:
      summary: Fee configs + ledger (admin)
      tags: [Fees]
      responses:
        "200":
          description: Fees
    post:
      summary: Create fee config
      tags: [Fees]
      responses:
        "201":
          description: Created
  /api/v1/fees/{id}:
    patch:
      summary: Update fee config
      tags: [Fees]
      responses:
        "200":
          description: Updated
    delete:
      summary: Soft-deactivate fee config
      tags: [Fees]
      responses:
        "200":
          description: Deactivated
  /api/v1/documents:
    get:
      summary: List org documents
      tags: [Documents]
      responses:
        "200":
          description: Documents
  /api/v1/documents/upload:
    post:
      summary: Upload PDF/PNG/JPEG
      tags: [Documents]
      responses:
        "201":
          description: Stored
  /api/v1/documents/download:
    get:
      summary: Download by key (org-scoped)
      tags: [Documents]
      parameters:
        - name: key
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: File bytes
  /api/v1/admin/analytics:
    get:
      summary: Admin portfolio analytics
      tags: [Admin]
      responses:
        "200":
          description: Aggregates
  /api/v1/admin/reconciliation:
    get:
      summary: Period reconciliation summary
      tags: [Admin]
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Disbursed/collected/variance
  /api/v1/admin/audit:
    get:
      summary: Audit log
      tags: [Admin]
      responses:
        "200":
          description: Audit rows
  /api/v1/webhooks/payment-update:
    post:
      summary: AfyaX payment webhook (HMAC + idempotency)
      tags: [Webhooks]
      security: [apiKeyAuth: []]
      responses:
        "200":
          description: Applied
  /api/v1/auth/login-otp:
    post:
      tags: [Auth]
      summary: Complete sign-in with the emailed code when login OTP is enabled
      description: |
        When a super admin enables login OTP, `/auth/login` returns `{ otpRequired: true }` after a correct password
        and emails a 6-digit code. Submit it here to receive tokens. Approval OTPs (opt-in, verification, consent)
        stay mandatory whether or not login OTP is enabled.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string, format: email }
                otp: { type: string, example: '482913' }
      responses:
        '200': { description: Access token and user (same shape as /auth/login) }
        '400': { description: invalid_otp }
        '429': { description: otp_locked after 5 wrong attempts }
  /api/v1/external/opt-ins:
    post:
      tags: [OptIns]
      summary: Partner-submitted supplier opt-in (sale instruction) for a buyer-originated IOU
      description: |
        Lets the originating platform (e.g. AfyaX) submit the supplier's accept/decline without the supplier
        signing in to IOUX. The API key must belong to the IOU's source platform or the supplier organisation.
        `actorEmail` must be an active user of the supplier organisation; the action, actor and `evidence`
        (consent text, partner event ID, timestamp) are written to the audit log.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [iouRegistryId, decision, actorEmail]
              properties:
                iouRegistryId: { type: string, example: IOU-KE-2026-000123 }
                decision: { type: string, enum: [accept, decline] }
                actorEmail: { type: string, format: email }
                listedAmount: { type: number, description: 'Amount to sell; must be > 0 and <= face value' }
                declineReason: { type: string }
                evidence: { type: string, maxLength: 2000, description: 'Consent evidence captured on the partner platform' }
      responses:
        '200':
          description: Updated lifecycle status
          content:
            application/json:
              example: { iouRegistryId: IOU-KE-2026-000123, status: pending_settlement, decision: accept, assignmentId: 7c1e... }
        '400': { description: 'invalid_state — no pending opt-in; invalid_listed_amount' }
        '403': { description: 'forbidden — key not authorised for this IOU; actor_not_authorised' }
        '404': { description: IOU not found }
  /api/v1/invoices/{id}/registry.pdf:
    get:
      tags: [Invoices]
      summary: Printable registry record of the invoice / IOU (parties, terms, line items, instalments)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: PDF, content: { application/pdf: {} } }
  /api/v1/standing-orders:
    get:
      tags: [Invoices]
      summary: List bank standing orders recorded against instruments (scoped to caller's organisation)
      responses:
        '200': { description: List }
    post:
      tags: [Invoices]
      summary: Record a bank standing order for an instrument (IOUX records; the bank executes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoiceId, bankName, amount, firstExecutionDate]
              properties:
                invoiceId: { type: string, format: uuid }
                bankName: { type: string }
                accountMasked: { type: string, description: 'Stored masked to the last 4 digits' }
                reference: { type: string }
                amount: { type: number }
                currency: { type: string, default: KES }
                firstExecutionDate: { type: string, format: date }
                frequency: { type: string, enum: [once, monthly, per_installment] }
      responses:
        '201': { description: Created with status requested }
  /api/v1/standing-orders/{id}:
    patch:
      tags: [Invoices]
      summary: Move a standing order through its lifecycle (history is preserved)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [requested, confirmed, executed, failed, cancelled, amended] }
                statusReason: { type: string }
      responses:
        '200': { description: Updated }
  /api/v1/credential-invites:
    post:
      tags: [Admin]
      summary: Register a project and send its technical contact a one-time, time-limited credential link
      description: The email carries only the link. The API key is generated and shown once when the link is claimed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orgId, projectName, contactName, contactEmail]
              properties:
                orgId: { type: string, format: uuid }
                projectName: { type: string }
                contactName: { type: string }
                contactEmail: { type: string, format: email }
                environment: { type: string, enum: [sandbox, production] }
                scopes: { type: array, items: { type: string } }
      responses:
        '201': { description: Invitation created and emailed }
  /api/v1/credential-invites/claim:
    post:
      tags: [Admin]
      summary: Claim a credential link once — returns the API key a single time
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { description: API key (shown once) }
        '400': { description: invalid_invite — expired, revoked or already claimed }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
